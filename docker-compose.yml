version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thekasir_backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thekasir_frontend
    ports:
      - "3089:3000"
    environment:
      # API Base agar frontend tahu harus fetch kemana
      - NUXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped
