version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: thekasir_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thekasir
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d thekasir"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thekasir_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Perhatikan host database berubah menjadi nama service "postgres"
      - DATABASE_URL=postgres://root:password@postgres:5432/thekasir?sslmode=disable
      - JWT_SECRET=supersecret_dev_key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thekasir_frontend
    ports:
      - "3000:3000"
    environment:
      # API Base agar frontend tahu harus fetch kemana
      - NUXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
